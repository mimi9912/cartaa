<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi amor 💌</title>
    <style>
        /* --- 1. FONDO BLANCO Y GATITO TAMAÑO NORMAL --- */
        body {
            background-color: #ffffff; /* Blanco puro para fundirse con tus imágenes */
            background-image: url('gato.jpg');
            background-repeat: no-repeat;
            background-position: center top 10%; /* Gatito centrado arriba */
            background-size: 350px; /* TAMAÑO FIJO: ¡Chau gato gigante! */
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* --- 2. CONTENEDOR DEL SOBRE --- */
        .sobre-contenedor {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            cursor: pointer;
            transition: transform 0.4s ease;
            z-index: 10;
        }
        .sobre-contenedor:hover {
            transform: translateX(-50%) scale(1.05);
        }

        /* --- 3. EL SOBRE MÁGICO --- */
        .sobre {
            width: 250px;
            height: auto;
            image-rendering: pixelated;
            display: block;
            /* ¡MAGIA! Esto borra el fondo blanco del JPG y deja solo tu dibujo */
            mix-blend-mode: multiply; 
        }

        /* --- Texto inicial --- */
        .texto-inicio {
            position: absolute;
            bottom: -30px;
            width: 100%;
            text-align: center;
            color: #ff6b81; /* Rosita que se lee bien en blanco */
            font-size: 15px;
            font-weight: bold;
            animation: parpadear 1.5s infinite;
            pointer-events: none;
            white-space: nowrap;
        }

        /* --- 4. LA CARTA --- */
        .carta {
            background-image: url('carta.png');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            width: 320px;
            height: 420px;
            padding: 45px 30px; /* Espacio para que el texto no pise a tus gatitos editados */
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            position: absolute;
            bottom: 20px; 
            left: 50%;
            transform: translateX(-50%) translateY(0) scale(0.8);
            z-index: 5;
            transition: transform 1s ease-in-out, opacity 0.8s ease-in-out;
            opacity: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-start; /* Hace que el texto empiece desde arriba */
            align-items: center;
            box-sizing: border-box;
            color: #3b2f2f;
        }
        
        .carta h1 {
            font-size: 18px;
            margin-top: 10px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: bold;
        }
        
        .carta p {
            line-height: 1.5;
            font-size: 13px;
            text-align: left;
            white-space: pre-line;
            margin: 0;
        }

        /* --- Animación de apertura --- */
        .sobre-contenedor.abierto .carta {
            transform: translateX(-50%) translateY(-200px) scale(1);
            opacity: 1;
            z-index: 15;
        }
        
        .sobre-contenedor.abierto .sobre {
            opacity: 0; /* El sobre se oculta suavemente para que puedas leer bien la carta */
            transition: opacity 0.5s ease;
        }

        .sobre-contenedor.abierto .texto-inicio {
            opacity: 0;
        }

        @keyframes parpadear {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
    </style>
</head>
<body>

    <div class="sobre-contenedor" id="contenedorCarta">
        <img src="sobre.jpg" alt="Sobre de carta" class="sobre" draggable="false">
        <div class="texto-inicio">Toca para abrir 💌</div>

        <div class="carta">
            <h1>¡Feliz Cumpleaños! ✨</h1>
            <p>
                ¡Hola mi amor! 
                
                Escribí esta carta solo para recordarte lo muchísimo que te amo y lo feliz que soy a tu lado.
                
                Que este nuevo año de vida te traiga hermosos momentos y que todos tus deseos se cumplan. 
                
                Te amo con todo mi corazón. ❤️
            </p>
        </div>
    </div>

    <script>
        const contenedor = document.getElementById('contenedorCarta');
        contenedor.addEventListener('click', () => {
            contenedor.classList.toggle('abierto');
        });
    </script>
</body>
</html>
