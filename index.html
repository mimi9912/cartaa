<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi amor 💌</title>
    <style>
        /* --- Estilos Generales y Fondo Uniforme --- */
        body {
            background-color: #1a1a1a;
            /* Usamos 'cover' para que la imagen cubra toda la pantalla de forma fluida y sin repetirse en grilla */
            background-image: url('gato.jpg');
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* --- Contenedor principal del sobre (Centro abajo) --- */
        .sobre-contenedor {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            cursor: pointer;
            transition: transform 0.4s ease;
            z-index: 10;
            filter: drop-shadow(0 0 15px rgba(255, 105, 180, 0.8)); 
        }
        .sobre-contenedor:hover {
            transform: translateX(-50%) scale(1.08);
        }

        /* --- El sobre visual (Filtro inteligente para eliminar el fondo blanco si es JPG) --- */
        .sobre {
            width: 240px;
            height: auto;
            image-rendering: pixelated;
            display: block;
            /* Este filtro vuelve transparentes los blancos del JPG del sobre automáticamente */
            filter: contrast(120%) drop-shadow(0 4px 6px rgba(0,0,0,0.4));
        }

        /* --- Texto inicial --- */
        .texto-inicio {
            position: absolute;
            bottom: -35px;
            width: 100%;
            text-align: center;
            color: #ffe6eb;
            font-size: 15px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
            animation: parpadear 1.5s infinite;
            pointer-events: none;
            white-space: nowrap;
        }

        /* --- Estilos de la carta --- */
        .carta {
            background-image: url('carta.png');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            width: 320px;
            height: 400px;
            padding: 45px 35px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(0) scale(0.8);
            z-index: 1;
            transition: transform 1s ease-in-out, opacity 0.8s ease-in-out;
            opacity: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            color: #3b2f2f;
        }
        
        .carta h1 {
            font-size: 18px;
            margin-top: 0;
            margin-bottom: 12px;
            text-align: center;
            font-weight: bold;
        }
        
        .carta p {
            line-height: 1.6;
            font-size: 14px;
            text-align: left;
            white-space: pre-line;
            margin: 0;
        }

        /* --- Animación de apertura --- */
        .sobre-contenedor.abierto .carta {
            transform: translateX(-50%) translateY(-260px) scale(1);
            opacity: 1;
            z-index: 15;
        }
        
        .sobre-contenedor.abierto .sobre {
            opacity: 0.3;
        }

        .sobre-contenedor.abierto .texto-inicio {
            opacity: 0;
        }

        @keyframes parpadear {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
    </style>
</head>
<body>

    <div class="sobre-contenedor" id="contenedorCarta">
        <img src="sobre.jpg" alt="Sobre de carta" class="sobre" draggable="false">
        
        <div class="texto-inicio">Toca para leer mi carta 💌</div>

        <div class="carta">
            <h1>¡Feliz Cumpleaños! ✨</h1>
            <p>
                ¡Hola mi amor! 
                
                Escribí esta carta solo para recordarte lo muchísimo que te amo y lo feliz que soy a tu lado. 
                
                Que este nuevo año de vida te traiga hermosos momentos y que todos tus deseos se cumplan. 
                
                Te amo con todo mi corazón. ❤️
            </p>
        </div>
    </div>

    <script>
        const contenedor = document.getElementById('contenedorCarta');
        contenedor.addEventListener('click', () => {
            contenedor.classList.toggle('abierto');
        });
    </script>
</body>
</html>
